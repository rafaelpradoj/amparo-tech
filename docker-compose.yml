services:
  # Serviço principal da aplicação web (Flask)
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - .:/app 
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    env_file:
      - .env

    # Remove todas as capacidades extras do Linux e impede o processo de ganhar novos privilégios
    #security_opt:
    #  - no-new-privileges:true
    #cap_drop:
    #  - ALL

    # Adição de healthcheck para o Flask usando biblioteca nativa do Python (evita dependência de curl)
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Agora o web aguarda o healthcheck do 'db' passar antes de iniciar
    depends_on:
      db:
        condition: service_healthy

  # Serviço de banco de dados PostgreSQL
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

    # Adição de healthcheck nativo do PostgreSQL (pg_isready)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: